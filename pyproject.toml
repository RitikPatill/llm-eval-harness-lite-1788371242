[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-eval-harness-lite"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.35",
    "anthropic>=0.29",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "click>=8.1",
    "rich>=13.7",
    "pydantic>=2.8",
    "jinja2>=3.1",
    "aiosqlite>=0.20",
]

[project.scripts]
eval = "eval.__main__:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
